name: Whisper360 UI Tests

on:
  # Manual trigger — click "Run workflow" in the Actions tab, or `gh workflow run tests.yml`,
  # whenever you want to pick that day yourself.
  workflow_dispatch: {}
  # Automatic run every Monday and Friday at 06:00 West Africa Time (UTC+1) = 05:00 UTC.
  # Cron is always UTC — adjust the hour here if you ever change timezone.
  schedule:
    - cron: '0 5 * * 1,5'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run tests
        env:
          TEST_URL: ${{ secrets.TEST_URL }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: npx playwright test

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
